[package]
name = "fixed_analytics"
version = "4.7.3"
edition.workspace = true
rust-version.workspace = true
authors = ["David Gathercole"]
description = "Fixed-point mathematical functions. Accurate, deterministic, and panic free."
repository = "https://github.com/GeEom/fixed_analytics"
documentation = "https://docs.rs/fixed_analytics"
readme = "README.md"
license = "MIT"
keywords = ["fixed-point", "trigonometry", "math", "no_std", "deterministic"]
categories = ["mathematics", "no-std", "algorithms", "embedded"]
# Derivation notes for maintainers, which the code comments cite (docs.rs
# shows only the pages lib.rs and the modules include), and the local gate
# and CI configuration, which would pin anyone building the packaged crate to
# this repo's toolchain.
exclude = [
    "docs/engine.md", "docs/sqrt.md",
    "rust-toolchain.toml", "clippy.toml", "codecov.yml", ".github/",
]

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = []
verify-no-panic = ["dep:no-panic"]

[dependencies]
fixed = "1.31"
no-panic = { version = "0.1.37", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "verify_no_panic"
required-features = ["verify-no-panic"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.no-panic-check]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.bench]
lto = true
codegen-units = 1

[package.metadata.check]
no_panic_coverage = ["src/ops"]

[lints]
workspace = true

[workspace]
exclude = ["tools"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
# groups — priority -1, or clippy's lint_groups_priority fails an allow below
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible     = { level = "deny", priority = -1 }
nonstandard_style       = { level = "deny", priority = -1 }
rust_2018_idioms        = { level = "deny", priority = -1 }
unused                  = { level = "deny", priority = -1 }
missing_docs            = "deny"
unsafe_code             = "deny"
unsafe_op_in_unsafe_fn  = "deny"

[workspace.lints.clippy]
# groups — priority -1 so specific lines can override
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
nursery     = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# individual denies
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
used_underscore_binding         = "deny"
if_then_some_else_none          = "deny"
missing_const_for_fn            = "deny"
missing_errors_doc              = "deny"
missing_panics_doc              = "deny"
indexing_slicing                = "deny"
result_large_err                = "deny"
shadow_unrelated                = "deny"
wildcard_imports                = "deny"
map_err_ignore                  = "deny"
enum_glob_use                   = "deny"
infinite_loop                   = "deny"
unimplemented                   = "deny"
expect_used                     = "deny"
unwrap_used                     = "deny"
empty_loop                      = "deny"
mem_forget                      = "deny"
dbg_macro                       = "deny"
panic                           = "deny"
todo                            = "deny"
exit                            = "deny"
unreachable                     = "deny"
let_underscore_must_use         = "deny"
let_underscore_untyped          = "deny"
print_stdout                    = "deny"
print_stderr                    = "deny"
unused_result_ok                = "deny"
undocumented_unsafe_blocks      = "deny"
multiple_unsafe_ops_per_block   = "deny"
iter_over_hash_type             = "deny"
# the only permitted allows
module_name_repetitions = "allow"
similar_names           = "allow"
redundant_pub_crate     = "allow"
multiple_crate_versions = "allow"
