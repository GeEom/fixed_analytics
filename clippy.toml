# Rendered for check.sh, which fails unless this file reads exactly so, and
# which bans every other clippy config in the repo.
# Banned calls stay banned in test code. Tests may print, as the harness
# captures what they print.
allow-unwrap-in-tests = false
allow-expect-in-tests = false
allow-panic-in-tests = false
allow-indexing-slicing-in-tests = false
allow-print-in-tests = true
# Lint public items too, even where the fix changes their API.
avoid-breaking-exported-api = false
